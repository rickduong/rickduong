<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Rick's cycling photo collage.">
    <title>Rick's Bike</title>
    <style>
      :root {
        --bg: #f3f1eb;
        --text: #1d241f;
        --muted: #5c665f;
        --gap: 8px;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      body {
        padding: var(--gap);
      }

      .collage {
        max-width: 980px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--gap);
      }

      .photo {
        display: block;
        position: relative;
        overflow: hidden;
        background: #dfe4df;
        text-decoration: none;
        aspect-ratio: 4 / 3;
      }

      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.45s ease, filter 0.45s ease;
      }

      .photo:hover img,
      .photo:focus-visible img {
        transform: scale(1.03);
        filter: saturate(1.05);
      }

      .photo:focus-visible {
        outline: 3px solid #1d241f;
        outline-offset: 3px;
      }

      @media (max-width: 700px) {
        .collage {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="collage" aria-label="Cycling photo collage">
      <a class="photo" href="photo.html?photo=2021-06-04_14-00-13_232" aria-label="View cycling photo">
        <img src="photos/2021-06-04_14-00-13_232.jpg" alt="Cycling photo from the Pacific Northwest" loading="eager">
      </a>

      <a class="photo" href="photo.html?photo=2019-07-25_09-48-25_000" aria-label="View cycling photo">
        <img src="photos/2019-07-25_09-48-25_000.jpeg" alt="Cycling photo from 2019" loading="lazy">
      </a>
    </main>
  </body>
</html>
