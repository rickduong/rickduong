<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Rick's cycling photo collage.">
    <title>Rick's Bike</title>
    <style>
      :root {
        --bg: #f3f1eb;
        --text: #1d241f;
        --muted: #5c665f;
        --gap: 8px;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      body {
        padding: var(--gap);
      }

      .collage {
        width: min(100%, 760px);
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: var(--gap);
      }

      .photo {
        display: block;
        flex: 0 1 320px;
        overflow: hidden;
        background: #dfe4df;
        text-decoration: none;
      }

      .photo img {
        width: 100%;
        height: auto;
        display: block;
        transition: transform 0.45s ease, filter 0.45s ease;
      }

      .photo:hover img,
      .photo:focus-visible img {
        transform: scale(1.03);
        filter: saturate(1.05);
      }

      .photo:focus-visible {
        outline: 3px solid #1d241f;
        outline-offset: 3px;
      }

      .status {
        width: 100%;
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 700px) {
        .photo {
          flex-basis: 100%;
          max-width: 420px;
        }
      }
    </style>
  </head>
  <body>
    <main id="collage" class="collage" aria-label="Cycling photo collage">
      <p class="status" role="status">Loading photos…</p>
    </main>

    <script>
      const collage = document.querySelector('#collage');
      const photosDirectory = 'https://api.github.com/repos/rickduong/rickduong/contents/ricksbike/photos';
      const imagePattern = /\.(avif|gif|jpe?g|png|webp)$/i;

      function addPhoto(file) {
        const link = document.createElement('a');
        link.className = 'photo';
        link.href = `photo.html?photo=${encodeURIComponent(file.name.replace(/\.[^.]+$/, ''))}`;
        link.setAttribute('aria-label', `View ${file.name}`);

        const image = document.createElement('img');
        image.src = file.download_url;
        image.alt = file.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ');
        image.loading = 'lazy';
        image.decoding = 'async';

        link.append(image);
        collage.append(link);
      }

      async function loadPhotos() {
        try {
          const response = await fetch(photosDirectory, {
            headers: { Accept: 'application/vnd.github+json' }
          });
          if (!response.ok) throw new Error(`Photo directory request failed: ${response.status}`);

          // GitHub returns only the direct children of this directory.
          // Keep files only so folders, including nested photo folders, are ignored.
          const files = await response.json();
          const photoFiles = files
            .filter(file => file.type === 'file' && imagePattern.test(file.name))
            .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

          collage.replaceChildren();
          photoFiles.forEach(addPhoto);

          if (photoFiles.length === 0) {
            collage.innerHTML = '<p class="status">No photos found.</p>';
          }
        } catch (error) {
          collage.innerHTML = '<p class="status">Photos could not be loaded.</p>';
          console.error(error);
        }
      }

      loadPhotos();
    </script>
  </body>
</html>
