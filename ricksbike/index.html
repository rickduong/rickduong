<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Rick's cycling photo collage.">
    <title>Rick's Bike</title>
    <style>
      :root {
        --bg: #f3f1eb;
        --text: #1d241f;
        --muted: #5c665f;
        --gap: 12px;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      body {
        padding: 20px;
      }

      .collage {
        width: min(100%, 980px);
        height: min(78vw, 700px);
        min-height: 460px;
        margin: 0 auto;
        position: relative;
      }

      .photo {
        display: block;
        position: absolute;
        width: clamp(130px, 19vw, 210px);
        aspect-ratio: 4 / 3;
        overflow: hidden;
        background: #dfe4df;
        text-decoration: none;
        box-shadow: 0 8px 20px rgb(29 36 31 / 14%);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }

      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.45s ease, filter 0.45s ease;
      }

      .photo:hover,
      .photo:focus-visible {
        transform: scale(1.04);
        box-shadow: 0 12px 28px rgb(29 36 31 / 24%);
        z-index: 2;
      }

      .photo:hover img,
      .photo:focus-visible img {
        filter: saturate(1.05);
      }

      .photo:focus-visible {
        outline: 3px solid #1d241f;
        outline-offset: 3px;
      }

      /* Let the hero keep its natural dimensions so the entire photo remains visible. */
      .photo--featured {
        width: clamp(250px, 39vw, 430px);
        height: auto;
        aspect-ratio: auto;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 1;
      }

      .photo--featured img {
        height: auto;
        object-fit: contain;
      }

      .photo--small:nth-of-type(2) { left: 50%; top: 0; transform: translateX(-50%); }
      .photo--small:nth-of-type(3) { right: 0; top: 50%; transform: translateY(-50%); }
      .photo--small:nth-of-type(4) { right: 8%; bottom: 0; }
      .photo--small:nth-of-type(5) { left: 50%; bottom: 0; transform: translateX(-50%); }
      .photo--small:nth-of-type(6) { left: 8%; bottom: 0; }
      .photo--small:nth-of-type(7) { left: 0; top: 50%; transform: translateY(-50%); }

      .status {
        margin: 0;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 700px) {
        body { padding: 12px; }

        .collage {
          height: auto;
          min-height: 0;
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: var(--gap);
        }

        .photo,
        .photo--featured {
          position: relative;
          inset: auto;
          width: min(100%, 360px);
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="collage" class="collage" aria-label="Cycling photo collage">
      <p class="status" role="status">Loading photos…</p>
    </main>

    <script>
      const collage = document.getElementById('collage');
      const photosDirectory = 'https://api.github.com/repos/rickduong/rickduong/contents/ricksbike/photos';
      const imagePattern = /\.(avif|gif|jpe?g|png|webp)$/i;

      function createPhotoLink(file, featured = false) {
        const link = document.createElement('a');
        link.className = featured ? 'photo photo--featured' : 'photo photo--small';
        link.href = `photo.html?photo=${encodeURIComponent(file.name.replace(/\.[^.]+$/, ''))}`;
        link.setAttribute('aria-label', `View ${file.name}`);

        const image = document.createElement('img');
        image.src = file.download_url;
        image.alt = file.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ');
        image.loading = featured ? 'eager' : 'lazy';
        image.decoding = 'async';

        link.appendChild(image);
        return link;
      }

      async function loadPhotos() {
        try {
          const response = await fetch(photosDirectory, {
            headers: { Accept: 'application/vnd.github+json' }
          });
          if (!response.ok) throw new Error(`Photo directory request failed: ${response.status}`);

          // The API lists only direct children; folders are excluded here.
          const photoFiles = (await response.json())
            .filter(file => file.type === 'file' && imagePattern.test(file.name))
            .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

          collage.replaceChildren();

          if (!photoFiles.length) {
            collage.innerHTML = '<p class="status">No photos found.</p>';
            return;
          }

          collage.appendChild(createPhotoLink(photoFiles[0], true));
          photoFiles.slice(1, 7).forEach(file => collage.appendChild(createPhotoLink(file)));
        } catch (error) {
          collage.innerHTML = '<p class="status">Photos could not be loaded.</p>';
          console.error(error);
        }
      }

      loadPhotos();
    </script>
  </body>
</html>
