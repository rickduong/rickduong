<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Rick's cycling photo collage.">
    <title>Rick's Bike</title>
    <style>
      :root {
        --bg: #f3f1eb;
        --text: #1d241f;
        --muted: #5c665f;
        --gap: 8px;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      body {
        padding: 16px;
      }

      .collage {
        width: min(100%, 760px);
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(3, minmax(70px, 1fr));
        grid-template-rows: repeat(5, minmax(70px, 1fr));
        gap: var(--gap);
        align-items: stretch;
      }

      .photo {
        display: block;
        overflow: hidden;
        background: #dfe4df;
        text-decoration: none;
        position: relative;
        box-shadow: 0 8px 18px rgb(29 36 31 / 12%);
      }

      .photo img {
        width: 100%;
        height: 100%;
        display: block;
        transition: transform 0.35s ease, filter 0.35s ease;
      }

      .photo:hover img,
      .photo:focus-visible img {
        transform: scale(1.03);
        filter: saturate(1.05);
      }

      .photo:focus-visible {
        outline: 3px solid #1d241f;
        outline-offset: 3px;
      }

      .photo--featured {
        grid-column: 2;
        grid-row: 2 / span 3;
        min-height: 300px;
        background: #f4f2ee;
      }

      .photo--featured img {
        object-fit: contain;
        background: #f4f2ee;
      }

      .photo--small img {
        object-fit: cover;
      }

      .status {
        grid-column: 1 / -1;
        text-align: center;
        color: var(--muted);
        margin: 0;
      }

      @media (max-width: 700px) {
        .collage {
          grid-template-columns: repeat(2, minmax(110px, 1fr));
          grid-template-rows: auto;
        }

        .photo--featured {
          grid-column: 1 / -1;
          grid-row: auto;
          min-height: 240px;
        }
      }
    </style>
  </head>
  <body>
    <main id="collage" class="collage" aria-label="Cycling photo collage">
      <p class="status" role="status">Loading photos…</p>
    </main>

    <script>
      const collage = document.getElementById('collage');
      const photosDirectory = 'https://api.github.com/repos/rickduong/rickduong/contents/ricksbike/photos';
      const imagePattern = /\.(avif|gif|jpe?g|png|webp)$/i;
      const positions = [
        { column: 1, row: 1 },
        { column: 2, row: 1 },
        { column: 3, row: 1 },
        { column: 1, row: 2 },
        { column: 3, row: 2 },
        { column: 1, row: 3 },
        { column: 3, row: 3 },
        { column: 1, row: 4 },
        { column: 3, row: 4 },
        { column: 1, row: 5 },
        { column: 2, row: 5 },
        { column: 3, row: 5 }
      ];

      function createPhotoLink(file, featured = false) {
        const link = document.createElement('a');
        link.className = featured ? 'photo photo--featured' : 'photo photo--small';
        link.href = `photo.html?photo=${encodeURIComponent(file.name.replace(/\.[^.]+$/, ''))}`;
        link.setAttribute('aria-label', `View ${file.name}`);

        const image = document.createElement('img');
        image.src = file.download_url;
        image.alt = file.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ');
        image.loading = featured ? 'eager' : 'lazy';
        image.decoding = 'async';

        link.appendChild(image);
        return link;
      }

      async function loadPhotos() {
        try {
          const response = await fetch(photosDirectory, {
            headers: { Accept: 'application/vnd.github+json' }
          });
          if (!response.ok) throw new Error(`Photo directory request failed: ${response.status}`);

          const photoFiles = (await response.json())
            .filter(file => file.type === 'file' && imagePattern.test(file.name))
            .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

          collage.replaceChildren();

          if (!photoFiles.length) {
            collage.innerHTML = '<p class="status">No photos found.</p>';
            return;
          }

          collage.appendChild(createPhotoLink(photoFiles[0], true));

          photoFiles.slice(1).forEach((file, index) => {
            const item = createPhotoLink(file);
            const position = positions[index % positions.length];
            item.style.gridColumn = position.column;
            item.style.gridRow = position.row;
            collage.appendChild(item);
          });
        } catch (error) {
          collage.innerHTML = '<p class="status">Photos could not be loaded.</p>';
          console.error(error);
        }
      }

      loadPhotos();
    </script>
  </body>
</html>
